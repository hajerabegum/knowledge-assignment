<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <header>
        <nav class="navbar inter">
            <div class="logo">
               <img src="./assets/logo-navbar.png" alt="Knowledge Vault Logo">
            </div>
            <ul class="link-parent">
                <li><a href="#">Features</a></li>
                <li><a href="#">How it Works</a></li>
                <li><a href="#">Why It's Different</a></li>
            </ul>
            <button class="my-btn">Get Early Access</button>
        </nav>
    </header>

    <main>
        <section class="hero-parent">
    <div class="hero-dev inter">
        <span class="open">
            <span class="dot">◉</span> Early Access Now Open
        </span>
        
        <h1 class="hero-heading">
            Structured Thinking,<br>
            <span class="green-text">Not Just Note-Taking.</span>
        </h1>

        <p class="hero-description">
            A private space to store notes, links, and learning summaries — designed to<br>
            help you think clearly, connect ideas, and turn learning into long-term knowledge.
        </p>

        <div class="hero-btn-container">
            <button class="btn-primary">
                Start Building Your Vault 
                <img src="./assets/ArrowRight.png" alt="arrow">
            </button>
            
            <button class="btn-video">
                <span class="play-icon">▷</span> See How It Works
            </button>
        </div>
    </div>
</section>
    </main>
</body>
</html>
